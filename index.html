        // ============================================================
        //  IMAGE UPLOAD USING FIREBASE STORAGE
        // ============================================================
        async function uploadImageToFirebase(file) {
            const timestamp = Date.now();
            const random = Math.random().toString(36).substring(2, 8);
            const fileName = `properties/${timestamp}_${random}_${file.name}`;
            const fileRef = storage.ref(fileName);
            const snapshot = await fileRef.put(file);
            const downloadURL = await snapshot.ref.getDownloadURL();
            return downloadURL;
        }

        async function uploadMultipleImages(files) {
            const urls = [];
            for (const file of files) {
                try {
                    const url = await uploadImageToFirebase(file);
                    urls.push(url);
                    showMessage(`Uploaded: ${file.name}`, 'success');
                } catch (error) {
                    console.error('Upload error:', error);
                    showMessage(`Failed to upload ${file.name}: ${error.message}`, 'error');
                }
            }
            return urls;
        }
